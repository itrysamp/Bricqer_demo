</style></head><body><div id="app"></div><div id="modal-root"></div><div id="toast"></div><script type="module">const paths={grid:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',box:'m12 3 9 5-9 5-9-5 9-5 M3 8v10l9 5 9-5V8 M12 13v10 M7 6l9 5',bag:'M5 7h14l2 14H3L5 7 M8 8V6a4 4 0 0 1 8 0v2',chart:'M4 3v17h17 M8 15v-4 M13 15V7 M18 15v-7',store:'m4 3-2 6a4 4 0 0 0 6 3 4 4 0 0 0 8 0 4 4 0 0 0 6-3l-2-6H4 M4 13v8h16v-8 M9 21v-6h6v6',users:'M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6 M3 21v-3a6 6 0 0 1 12 0v3 M16 5a3 3 0 0 1 0 6 M18 15a5 5 0 0 1 3 5',refresh:'M20 8a8 8 0 0 0-14-3L3 8 M3 3v5h5 M4 16a8 8 0 0 0 14 3l3-3 M21 21v-5h-5',settings:'m9 3-1 3-3 1v4l-2 2 2 3 3 1 1 4h5l1-4 3-1 3-3-2-2V7l-4-1-1-3H9 M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0',help:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0 M9 9a3 3 0 0 1 6 0c0 2-3 2-3 5 M12 17h.01',chevron:'m9 5 7 7-7 7',down:'m7 10 5 5 5-5',search:'M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0 M16 16l5 5',bell:'M5 17h14l-2-3V9a5 5 0 0 0-10 0v5l-2 3 M10 21h4',plus:'M12 5v14 M5 12h14',arrow:'M5 12h14 m-5-5 5 5-5 5',trend:'m3 17 6-6 4 3 8-10 M15 4h6v6',calendar:'M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2 M3 10h18 M8 3v4 M16 3v4',download:'M12 3v12 m-5-5 5 5 5-5 M4 16v5h16v-5',check:'m5 12 4 4L19 6',close:'m6 6 12 12 M6 18 18 6'};
const I=n=>`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="${paths[n]||paths.box}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'€'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
let page='Overview',query='',filter='All orders',period='Last 30 days';
let orders=JSON.parse(localStorage.getItem('orders')||'null')||[{id:'BL-28491',name:'James Wilson',country:'United States',flag:'🇺🇸',store:'BrickLink',items:24,total:86.45,status:'To pack',date:'Today, 10:42'},{id:'BO-10842',name:'Emma de Vries',country:'Netherlands',flag:'🇳🇱',store:'BrickOwl',items:12,total:34.80,status:'To pack',date:'Today, 09:18'},{id:'BL-28490',name:'Thomas Müller',country:'Germany',flag:'🇩🇪',store:'BrickLink',items:56,total:142.60,status:'Shipped',date:'Today, 08:56'},{id:'BL-28489',name:'Sophie Laurent',country:'France',flag:'🇫🇷',store:'BrickLink',items:8,total:21.25,status:'Processing',date:'Yesterday'},{id:'BO-10841',name:'Oliver Smith',country:'United Kingdom',flag:'🇬🇧',store:'BrickOwl',items:32,total:67.90,status:'Shipped',date:'Yesterday'}];
let parts=JSON.parse(localStorage.getItem('parts')||'null')||[{id:'3001',name:'Brick 2 × 4',color:'Bright Red',qty:1240,price:.18,hex:'#d94735'},{id:'3020',name:'Plate 2 × 4',color:'Bright Blue',qty:865,price:.12,hex:'#4384cc'},{id:'3003',name:'Brick 2 × 2',color:'Bright Yellow',qty:542,price:.14,hex:'#e6b32a'},{id:'3004',name:'Brick 1 × 2',color:'Dark Green',qty:48,price:.10,hex:'#457a58'}];
function brick(hex='#ed713e'){return `<svg class="brick" viewBox="0 0 100 80"><path d="m12 35 40-18 37 18-40 19Z" fill="${hex}"/><path d="M12 35v24l37 18V54Z" fill="${hex}"/><path d="M49 54v23l40-18V35Z" fill="${hex}"/><path d="M49 54v23l40-18V35Z" fill="#000" opacity=".18"/>${[[33,30],[54,21],[52,40],[73,31]].map(([x,y])=>`<path d="M${x-8} ${y-5}v9c0 6 16 6 16 0v-9" fill="${hex}"/><ellipse cx="${x}" cy="${y-5}" rx="8" ry="4" fill="${hex}" stroke="#fff" stroke-opacity=".35"/>`).join('')}</svg>`}
const title=(s,p,a='')=>`<div class="page-heading"><div><h1>${s}</h1><p>${p}</p></div><div class="heading-actions">${a}</div></div>`;
const btn=(s,a,ic='',primary=false)=>`<button class="button ${primary?'primary':''}" data-action="${a}">${ic?I(ic):''}${s}</button>`;
const dateBtn=()=>btn(period+' '+I('down'),'period','calendar');
function metrics(){return `<div class="metrics">${[['Total revenue','€4,862.50','18.6%','chart'],['Orders received','128','12.3%','bag'],['Items sold','3,842','24.8%','box'],['Average order value','€37.99','5.6%','trend']].map(([s,v,p,i],n)=>`<div class="metric"><div class="metric-label">${s}<span class="metric-icon tone-${n}">${I(i)}</span></div><div class="metric-value">${v}</div><div class="metric-bottom"><b>${I('trend')}${p}</b><span>vs. previous period</span></div></div>`).join('')}</div>`}
function chart(){let pts=[175,165,181,147,159,170,143,119,141,158,133,143,109,122,89,107,117,78,62,95,101,65,72,78,43,52,81,63,89,47,32,54,37,45,16,29,13];let d=pts.map((y,i)=>`${i?'L':'M'}${52+i*20.5} ${y}`).join(' ');return `<div class="chart"><svg viewBox="0 0 810 245" preserveAspectRatio="none"><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f68a54" stop-opacity=".23"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>${[0,1,2,3,4].map(n=>`<line x1="52" y1="${20+n*45}" x2="790" y2="${20+n*45}" stroke="#eaecef" stroke-dasharray="4 5"/><text x="0" y="${24+n*45}" fill="#9698a0" font-size="11">€${600-n*150}</text>`).join('')}<path d="${d} L790 204 L52 204Z" fill="url(#area)"/><path d="M52 190 Q80 175 110 185 T170 174 T230 183 T290 156 T350 169 T410 143 T470 157 T530 132 T590 150 T650 123 T710 139 T770 106 L790 113" fill="none" stroke="#c6cbd0" stroke-width="2" stroke-dasharray="5 5"/><path d="${d}" fill="none" stroke="#ee713e" stroke-width="2.7" stroke-linejoin="round"/>${['Sep 1','Sep 5','Sep 10','Sep 15','Sep 20','Sep 25','Sep 30'].map((s,i)=>`<text x="${52+i*120}" y="234" fill="#9698a0" font-size="11">${s}</text>`).join('')}</svg></div>`}
function storeLogo(s){return `<span class="store-logo ${s==='BrickOwl'?'owl':''}">${s==='BrickOwl'?'◉◉':'B<span>▦</span>'}</span>`}
function storePanel(){return `<section class="panel stores-panel"><div class="panel-heading"><h2>Your connected stores</h2><span class="count-pill">2</span></div>${['BrickLink','BrickOwl'].map((s,i)=>`<div class="store-row">${storeLogo(s)}<div><strong>${s}</strong><small>Brick by Brick${i?'':' Store'}</small></div><span class="connected">Connected</span></div><div class="store-stats"><div><small>Revenue</small><strong>${i?'€1,214.30':'€3,648.20'}</strong></div><div><small>Orders</small><strong>${i?32:96}</strong></div><div><small>Inventory</small><strong>24,812</strong></div></div>`).join('')}<button class="panel-link" data-page="Stores & integrations">Manage stores ${I('arrow')}</button></section>`}
function table(rows,compact=false){return `<div class="table-scroll"><table><thead><tr><th>Order</th><th>Customer</th><th>Store</th>${compact?'':'<th>Items</th>'}<th>Total</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(o=>`<tr data-order="${o.id}"><td><strong class="order-id">#${o.id}</strong><small>${o.date}</small></td><td><strong>${o.name}</strong><small>${o.flag} ${o.country}</small></td><td><span class="store-chip ${o.store==='BrickOwl'?'owl':''}"><i>${o.store==='BrickOwl'?'◉':'▦'}</i>${o.store}</span></td>${compact?'':`<td>${o.items}</td>`}<td class="order-total">${money(o.total)}</td><td><span class="status ${o.status.toLowerCase().replace(' ','-')}"><i></i>${o.status}</span></td><td>${I('chevron')}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No matching orders.</td></tr>'}</tbody></table></div>`}
function overview(){return title('A little overview. A lot of possibility.','Welcome back, Alex. Here’s how your business is doing today.',dateBtn()+btn('Add inventory','add','plus',true))+metrics()+`<div class="middle-grid"><section class="panel revenue-panel"><div class="panel-heading"><div><h2>Revenue overview</h2><p>A good month, brick by brick.</p></div><div class="legend"><span><i class="orange"></i>This period</span><span><i class="gray"></i>Previous period</span><button data-action="chart-info">···</button></div></div>${chart()}<div class="chart-footer"><span>${I('trend')}Your revenue is up <strong>18.6%</strong> compared to last month.</span><button data-page="Analytics">View analytics ${I('arrow')}</button></div></section>${storePanel()}</div><div class="bottom-grid"><section class="panel recent-panel"><div class="panel-heading"><div class="inline-title"><h2>Recent orders</h2><span class="count-pill">128</span></div><button class="text-button" data-page="Orders">View all orders ${I('arrow')}</button></div>${table(orders.slice(0,4),true)}</section><section class="panel inventory-health"><div class="panel-heading"><h2>Inventory at a glance</h2>${I('box')}</div><div class="inventory-total"><strong>24,812</strong><span>total items in your inventory</span></div><div class="inventory-bar"><i></i><i></i><i></i></div>${[['green','In stock','24,126','97.2%'],['yellow','Low stock','486','2.0%'],['pale','Out of stock','200','0.8%']].map(([c,s,n,p])=>`<div class="health-line"><span><i class="dot ${c}"></i>${s}</span><strong>${n}<small>${p}</small></strong></div>`).join('')}<button class="stock-alert" data-action="low-stock">${I('box')}<span><strong>A little restock goes a long way</strong><small>18 lots are running low on stock.</small></span>${I('chevron')}</button><button class="panel-link" data-page="Inventory">View inventory ${I('arrow')}</button></section></div><div class="tip-bar"><span class="tip-icon">✧</span><div><strong>Less busywork. More building.</strong><span> Let Bricqer handle your inventory sync while you focus on growing your business.</span></div><button data-page="Stores & integrations">Explore automations ${I('arrow')}</button></div>`}
function ordersPage(){let rows=orders.filter(o=>(filter==='All orders'||filter===o.status)&&JSON.stringify(o).toLowerCase().includes(query.toLowerCase()));return title('Orders','Every order, one place. Ready for your next delivery.',btn('Export orders','export','download'))+`<section class="panel"><div class="table-toolbar"><div class="tabs">${['All orders','To pack','Processing','Shipped'].map(s=>`<button data-filter="${s}" class="${s===filter?'selected':''}">${s}</button>`).join('')}</div>${searchInput('Search orders...')}</div>${table(rows)}</section>`}
const searchInput=p=>`<label class="input-search">${I('search')}<input id="table-search" placeholder="${p}" value="${esc(query)}"></label>`;
function inventoryPage(){return title('Inventory','A home for every brick. Manage your lots across all stores.',btn('Export inventory','export','download')+btn('Add inventory','add','plus',true))+`<div class="inventory-summary">${[['Total lots',parts.length],['Available items',parts.reduce((s,p)=>s+p.qty,0).toLocaleString()],['Inventory value',money(parts.reduce((s,p)=>s+p.qty*p.price,0))]].map(([s,v])=>`<div class="panel"><small>${s}</small><h2>${v}</h2></div>`).join('')}</div><section class="panel"><div class="table-toolbar"><h2>All inventory <span class="count-pill">${parts.length}</span></h2>${searchInput('Search parts, colors, IDs...')}</div><div class="table-scroll"><table><thead><tr><th>Part</th><th>Part number</th><th>Color</th><th>Quantity</th><th>Price</th><th>Value</th><th></th></tr></thead><tbody>${parts.filter(p=>JSON.stringify(p).toLowerCase().includes(query.toLowerCase())).map(p=>`<tr data-part="${esc(p.id)}"><td><div class="part-name">${brick(p.hex)}<strong>${esc(p.name)}</strong></div></td><td>${esc(p.id)}</td><td><i class="color-swatch" style="background:${p.hex}"></i>${esc(p.color)}</td><td>${p.qty}</td><td>${money(p.price)}</td><td>${money(p.qty*p.price)}</td><td>${I('chevron')}</td></tr>`).join('')}</tbody></table></div></section>`}
function analytics(){return title('Analytics','The big picture behind your business.',dateBtn())+metrics()+`<section class="panel"><div class="panel-heading"><h2>Revenue over time</h2><span class="connected">18.6% growth</span></div>${chart()}</section><div class="inventory-summary">${[['BrickLink','75% of revenue','€3,648.20'],['BrickOwl','25% of revenue','€1,214.30'],['Returning customers','Customers who ordered again','32.8%']].map(([s,p,v])=>`<div class="panel"><h2>${s}</h2><p>${p}</p><h1>${v}</h1></div>`).join('')}</div>`}
function customers(){return title('Customers','The people who bring your bricks to life.')+`<section class="panel"><div class="panel-heading"><h2>Your customers</h2><span class="count-pill">${orders.length}</span></div><table><thead><tr><th>Customer</th><th>Location</th><th>Last order</th><th>Total spent</th></tr></thead><tbody>${orders.map(o=>`<tr data-order="${o.id}"><td><strong>${o.name}</strong></td><td>${o.flag} ${o.country}</td><td>#${o.id}</td><td>${money(o.total)}</td></tr>`).join('')}</tbody></table></section>`}
function stores(){return title('Stores & integrations','Your business, connected. Keep every store in sync.',btn('Connect a store','connect','plus',true))+`<div class="integration-grid">${['BrickLink','BrickOwl'].map(s=>`<section class="panel integration">${storeLogo(s)}<span class="connected">Demo connection</span><h2>${s}</h2><p>Sync inventory, import orders, and manage your store from one workspace.</p><div class="integration-detail"><span>Inventory sync</span><strong>Enabled ${I('check')}</strong></div><div class="integration-detail"><span>Order imports</span><strong>Enabled ${I('check')}</strong></div>${btn('Configure connection '+I('arrow'),'connect')}</section>`).join('')}</div><div class="notice">${I('help')}These stores use demo data. Live synchronization requires a server-side API integration.</div>`}
function settings(){return title('Settings','Make this workspace your own.')+`<section class="panel settings"><h2>Workspace details</h2><form id="settings-form"><label>Workspace name<input name="workspace" value="${esc(localStorage.getItem('workspace-name')||'Brick by Brick')}"></label><label>Your name<input name="name" value="${esc(localStorage.getItem('owner-name')||'Alex Lewis')}"></label><label>Currency<select><option>EUR — Euro</option></select></label><button class="button primary">Save changes</button></form><hr><h2>API integrations</h2><p>Configure API credentials using server-side environment variables. This demo does not collect or store API secrets.</p>${btn('View integration setup '+I('arrow'),'connect')}</section>`}
function render(){document.querySelector('#app').innerHTML=`<aside class="sidebar"><a class="brand" href="#" data-page="Overview"><span>${brick()}</span>bricqer<span class="brand-dot">.</span></a><button class="workspace" data-page="Settings"><span class="workspace-avatar">B<i></i></span><span><strong>${esc(localStorage.getItem('workspace-name')||'Brick by Brick')}</strong><small>My workspace</small></span>${I('down')}</button><div class="nav-label">WORKSPACE</div><nav>${[['Overview','grid'],['Orders','bag'],['Inventory','box'],['Analytics','chart'],['Customers','users'],['Stores & integrations','store']].map(([s,i])=>`<button class="nav-item ${s===page?'active':''}" data-page="${s}">${I(i)}<span>${s}</span>${s==='Orders'?'<b class="nav-count">12</b>':''}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="sync-card"><strong><i></i>Everything is in sync</strong><p>All your stores. Working together.</p><button data-action="sync">${I('refresh')}Last synced just now</button></div><button class="nav-item ${page==='Settings'?'active':''}" data-page="Settings">${I('settings')}Settings</button><button class="nav-item" data-action="help">${I('help')}Help & resources ${I('chevron')}</button><button class="profile" data-page="Settings"><span class="avatar">AL</span><span><strong>${esc(localStorage.getItem('owner-name')||'Alex Lewis')}</strong><small>Store owner</small></span>${I('down')}</button></div></aside><div class="main-shell"><header><div class="breadcrumb">Workspace ${I('chevron')}<span>${page}</span></div><div class="header-right"><button class="global-search" data-action="search">${I('search')}<span>Search anything...</span><kbd>⌘ K</kbd></button><i class="header-divider"></i><button class="notification" data-action="notifications">${I('bell')}<i></i></button><span class="avatar small-avatar">AL</span></div></header><main>${({Overview:overview,Orders:ordersPage,Inventory:inventoryPage,Analytics:analytics,Customers:customers,Settings:settings,'Stores & integrations':stores}[page])()}</main><footer><span><i></i>All systems operational</span><span>Made for the love of bricks.<b>bricqer.</b></span></footer></div>`;bind()}
function go(s){page=s;query='';render();window.scrollTo(0,0)}
function modal(html){document.querySelector('#modal-root').innerHTML=`<div class="modal-overlay"><section class="modal"><button class="close-modal" id="close-modal">${I('close')}</button>${html}</section></div>`;document.querySelector('#close-modal').onclick=closeModal;document.querySelector('.modal-overlay').onclick=e=>{if(e.target.classList.contains('modal-overlay'))closeModal()}}
function closeModal(){document.querySelector('#modal-root').innerHTML=''}
function toast(s){let t=document.querySelector('#toast');t.textContent=s;t.classList.add('visible');setTimeout(()=>t.classList.remove('visible'),3500)}
function editPart(id){let p=parts.find(p=>p.id===id);modal(`<div class="modal-symbol">${I('box')}</div><h2>${p?'Edit part':'Add to your inventory'}</h2><p>Every great store starts with a few bricks.</p><form id="part-form"><label>Part name<input name="name" required value="${esc(p?.name||'')}" placeholder="Brick 2 × 4"></label><div class="form-row"><label>Part number<input name="id" required value="${esc(p?.id||'')}" placeholder="3001"></label><label>Color<input name="color" required value="${esc(p?.color||'')}" placeholder="Bright Red"></label></div><div class="form-row"><label>Quantity<input name="qty" required type="number" min="0" value="${p?.qty||1}"></label><label>Price (€)<input name="price" required type="number" min="0" step=".01" value="${p?.price||.1}"></label></div><button class="button primary full">${p?'Save changes':'Add inventory'}</button></form>`);document.querySelector('#part-form').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let part={...d,qty:+d.qty,price:+d.price,hex:p?.hex||'#eb7949'};if(parts.some(x=>x!==p&&x.id===d.id))return toast('That part number already exists.');if(p)parts[parts.indexOf(p)]=part;else parts.push(part);localStorage.setItem('parts',JSON.stringify(parts));closeModal();go('Inventory');toast('Inventory saved successfully')}}
function orderDetail(id){let o=orders.find(o=>o.id===id);modal(`<div class="modal-symbol">${I('bag')}</div><h2>Order #${o.id}</h2><p>${o.date} · ${o.store}</p><div class="order-detail"><span>Customer</span><strong>${o.name}</strong><span>Destination</span><strong>${o.flag} ${o.country}</strong><span>Items</span><strong>${o.items}</strong><span>Order total</span><strong>${money(o.total)}</strong></div><label>Order status<select id="order-status">${['To pack','Processing','Shipped','Delivered'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></label><button class="button primary full" id="save-order">Save order</button>`);document.querySelector('#save-order').onclick=()=>{o.status=document.querySelector('#order-status').value;localStorage.setItem('orders',JSON.stringify(orders));closeModal();render();toast('Order status updated')}}
function action(a){if(a==='add')return editPart();if(a==='sync')return toast('Demo inventory is up to date. Connect an API for live sync.');if(a==='period'){modal(`<h2>Select a date range</h2><p>Demo reports show sample September data.</p><div class="period-options">${['Last 7 days','Last 30 days','Last 90 days','This year'].map(s=>`<button class="button" data-period="${s}">${s}${s===period?I('check'):''}</button>`).join('')}</div>`);document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{period=b.dataset.period;closeModal();render()});return}if(a==='connect')return modal(`<div class="modal-symbol">${I('store')}</div><h2>Connect your store</h2><p>Bring your real inventory and orders into Bricqer.</p><div class="setup-step"><b>1</b><div><strong>Create API credentials</strong><p>Generate API access in your BrickLink or BrickOwl account settings.</p></div></div><div class="setup-step"><b>2</b><div><strong>Configure the server</strong><p>Store credentials in server-side environment variables. Never share passwords or API secrets in chat.</p></div></div><div class="setup-step"><b>3</b><div><strong>Enable live synchronization</strong><p>A backend adapter is required to authenticate requests and sync real data. This app currently uses demo data.</p></div></div>`);if(a==='notifications')return modal(`<h2>Your store activity</h2><p>Here’s what needs a little attention.</p><div class="activity">${I('bag')}<div><strong>2 orders are ready to pack</strong><p>Open Orders to review and update their status.</p></div></div><div class="activity">${I('box')}<div><strong>Your inventory could use a top-up</strong><p>Brick 1 × 2 has 48 pieces available.</p></div></div>`);if(a==='chart-info')return toast('Sample revenue data · September 1–30 · EUR');if(a==='low-stock'){go('Inventory');return toast('Low stock: Brick 1 × 2 · 48 pieces available')}if(a==='help')return modal(`<h2>A little help goes a long way.</h2><p>Manage your LEGO resale business from one workspace.</p><h3>Inventory</h3><p>Add parts, update quantities, and edit prices. Changes are saved in your browser.</p><h3>Orders</h3><p>Open any order to review customer details and change its status.</p><h3>Store connections</h3><p>Visit Stores & integrations for API setup requirements.</p>`);if(a==='export'){let rows=page==='Inventory'?parts:orders;let keys=Object.keys(rows[0]);let csv=[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(r[k]).replaceAll('"','""')+'"').join(','))].join('\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));let link=document.createElement('a');link.href=url;link.download='bricqer-'+page.toLowerCase()+'.csv';link.click();URL.revokeObjectURL(url);return toast('Export downloaded')}if(a==='search'){modal(`<h2>Find something</h2><label class="input-search full">${I('search')}<input id="global-input" placeholder="Search orders, parts, or customers..."></label><div id="search-results"><p>Start typing to search your workspace.</p></div>`);let inp=document.querySelector('#global-input');inp.focus();inp.oninput=e=>{let q=e.target.value.toLowerCase();document.querySelector('#search-results').innerHTML=parts.filter(p=>JSON.stringify(p).toLowerCase().includes(q)).map(p=>`<button class="search-result" data-found-part="${esc(p.id)}">${I('box')}${esc(p.name)} · ${esc(p.id)}${I('chevron')}</button>`).join('')+orders.filter(o=>JSON.stringify(o).toLowerCase().includes(q)).map(o=>`<button class="search-result" data-found-order="${o.id}">${I('bag')}#${o.id} · ${o.name}${I('chevron')}</button>`).join('');document.querySelectorAll('[data-found-part]').forEach(b=>b.onclick=()=>editPart(b.dataset.foundPart));document.querySelectorAll('[data-found-order]').forEach(b=>b.onclick=()=>orderDetail(b.dataset.foundOrder))};}}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=e=>{e.preventDefault();go(b.dataset.page)});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>orderDetail(b.dataset.order));document.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>editPart(b.dataset.part));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});let input=document.querySelector('#table-search');if(input)input.oninput=e=>{let p=e.target.selectionStart;query=e.target.value;render();let inp=document.querySelector('#table-search');inp.focus();inp.setSelectionRange(p,p)};let form=document.querySelector('#settings-form');if(form)form.onsubmit=e=>{e.preventDefault();let d=new FormData(e.target);localStorage.setItem('workspace-name',d.get('workspace'));localStorage.setItem('owner-name',d.get('name'));render();toast('Workspace settings saved')}}
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();action('search')}if(e.key==='Escape')closeModal()});render();
</script></body></html>
